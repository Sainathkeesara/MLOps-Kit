name: lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint
          pip install ruff --quiet

      - name: Lint shell scripts
        run: |
          find . -name "*.sh" -not -path "./.git/*" -exec shellcheck {} \+

      - name: Lint Python
        run: |
          find . -name "*.py" -not -path "./.git/*" -exec ruff check {} \+
          find . -name "*.py" -not -path "./.git/*" -exec ruff format --check {} \+ || true

      - name: Lint YAML
        run: |
          find . -name "*.yaml" -o -name "*.yml" | grep -v ".git/" | xargs yamllint -d relaxed
