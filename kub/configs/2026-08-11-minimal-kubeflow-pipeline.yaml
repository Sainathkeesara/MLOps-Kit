---
# kub-041 — Minimal Kubeflow pipeline configuration with a single component (L1)
#
# First-contact notes: I just learned that a Kubeflow Pipeline is a YAML file
# describing a DAG of container steps. Here's the smallest valid pipeline I
# could write — one component that prints a greeting, wired into a pipeline
# that runs just that step.
#
# Key pieces:
# - pipelineInfo: the pipeline's name
# - deploymentSpec: which container image the step runs
# - root.dag.tasks: the entry-point DAG (one task here)
# - components: defines the single step

apiVersion: pipelines.kubeflow.org/v1beta1
kind: Pipeline
metadata:
  name: single-step-pipeline
  annotations:
    description: "Minimal Kubeflow pipeline — one component, one step"
spec:
  pipelineSpec:
    pipelineInfo:
      name: single-step-pipeline
    deploymentSpec:
      executors:
        hello-exec:
          container:
            image: python:3.11-slim
            command: ["python", "-c"]
            args: ["print('hello from kubeflow')"]
    root:
      dag:
        tasks:
          hello:
            componentRef:
              name: hello-component
    components:
      hello-component:
        executorLabel: hello-exec
