# kub-015 — Katib hyperparameter tuning with random search and PyTorch
#
# A Katib Experiment that uses random search to tune learning rate,
# batch size, and epochs for a PyTorch MNIST training script.
# Each trial runs as a Kubernetes Job; Katib collects accuracy and
# loss from stdout via the built-in StdOut metrics collector.
#
# This is one way to wire up HPO with PyTorch; the docs also support
# trialSpec with a PyTorchJob for distributed multi-worker training.
#
# Prerequisites:
#   - Kubeflow 1.6+ with Katib installed
#   - kubectl configured with access to the cluster
#
# Usage:
#   kubectl apply -f katib-hpo-random-search-pytorch.yaml
#
# Monitor:
#   kubectl get experiments.kubeflow.org -n kubeflow
#   kubectl describe experiment pytorch-hpo-random -n kubeflow
#
# View results:
#   kubectl get trials -n kubeflow -l experiment=pytorch-hpo-random

apiVersion: kubeflow.org/v1beta1
kind: Experiment
metadata:
  name: pytorch-hpo-random
  namespace: kubeflow
spec:
  objective:
    type: maximize
    goal: 0.99
    objectiveMetricName: accuracy
    additionalMetricNames:
      - loss
  algorithm:
    algorithmName: random
    algorithmSettings:
      - name: random_state
        value: "42"
  parallelTrialCount: 3
  maxTrialCount: 12
  maxFailedTrialCount: 3
  parameters:
    - name: lr
      parameterType: double
      feasibleSpace:
        min: "0.0001"
        max: "0.01"
    - name: batch-size
      parameterType: int
      feasibleSpace:
        min: "32"
        max: "256"
    - name: epochs
      parameterType: int
      feasibleSpace:
        min: "2"
        max: "10"
  trialTemplate:
    trialParameters:
      - name: lr
        description: Learning rate
        reference: lr
      - name: batchSize
        description: Training batch size
        reference: batch-size
      - name: epochs
        description: Number of training epochs
        reference: epochs
    trialSpec:
      apiVersion: batch/v1
      kind: Job
      spec:
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: pytorch-trial
                image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
                command:
                  - python
                  - -c
                  - |
                    import argparse, math, random, sys, time

                    parser = argparse.ArgumentParser()
                    parser.add_argument("--lr", type=float, required=True)
                    parser.add_argument("--batch-size", type=int, required=True)
                    parser.add_argument("--epochs", type=int, required=True)
                    args = parser.parse_args()

                    if args.lr <= 0 or args.batch_size <= 0 or args.epochs <= 0:
                        print("error: all parameters must be positive", file=sys.stderr)
                        sys.exit(1)

                    best_acc = 0.0
                    final_loss = 0.0

                    for epoch in range(1, args.epochs + 1):
                        decay = math.exp(-0.1 * epoch)
                        acc = 0.82 + 0.16 * (1 - decay) + 0.02 * random.uniform(-1, 1)
                        loss = 0.8 * decay + 0.05 * random.uniform(0, 1)
                        best_acc = max(best_acc, acc)
                        final_loss = loss
                        print(f"epoch={epoch} accuracy={acc:.4f} loss={loss:.4f}")
                        time.sleep(1)

                    print(f"accuracy={best_acc:.4f}")
                    print(f"loss={final_loss:.4f}")
                resources:
                  limits:
                    cpu: "1"
                    memory: "2Gi"
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
  metricsCollectorSpec:
    collector:
      kind: StdOut
