# last_verified: 2026-07-11 · GitHub Actions CI/CD workflow
# kub-029 — CI/CD workflow for kubeflow-pipeline-scaffold template
# Lints Python, runs pytest, compiles the KFP pipeline, and on a main-branch
# push submits the compiled pipeline to a Kubeflow Pipelines endpoint.

name: CI/CD — Kubeflow Pipeline Scaffold

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Lint, test, and compile pipeline
    runs-on: ubuntu-latest
    outputs:
      pipeline_yaml: ${{ steps.compile.outputs.pipeline_yaml }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          python -m flake8 components/ scripts/
          python -m pylint --fail-under=7 components/ scripts/ || true

      - name: Run pytest
        run: pytest tests/ -v

      - name: Compile KFP pipeline
        id: compile
        run: |
          python pipeline.py
          echo "pipeline_yaml=pipeline.yaml" >> "$GITHUB_OUTPUT"

      - name: Upload compiled pipeline
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-yaml
          path: pipeline.yaml
          retention-days: 14

  deploy:
    name: Submit pipeline to Kubeflow
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: kubeflow

    steps:
      - name: Download compiled pipeline
        uses: actions/download-artifact@v4
        with:
          name: pipeline-yaml
          path: .

      - name: Install kfp CLI
        run: pip install kfp>=2.0.0

      - name: Submit to Kubeflow Pipelines
        env:
          KFP_HOST: ${{ secrets.KFP_HOST }}
        run: |
          python -c "
          import kfp
          client = kfp.Client(host='${{ secrets.KFP_HOST }}')
          client.upload_pipeline(
              pipeline_package_path='pipeline.yaml',
              pipeline_name='kubeflow-pipeline-scaffold',
          )
          print('Pipeline uploaded to KFP endpoint')
          "
