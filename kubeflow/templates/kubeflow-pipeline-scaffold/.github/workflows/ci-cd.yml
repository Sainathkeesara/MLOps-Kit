# last_verified: 2026-09-11 · kubeflow n/a
# kub-045 — CI/CD workflow for kubeflow-pipeline-scaffold (L2)
#
# The scaffold README lists .github/workflows/ci-cd.yml in its project
# structure, but the file is missing on disk. I'm building a workflow
# with lint, test, compile, and deploy jobs to match what the README
# promises.
#
# The lint step uses ruff because the kit standardizes on it. The test
# step runs the existing pytest suite in tests/. The compile step runs
# pipeline.py to verify KFP v2 compilation produces pipeline.yaml —
# this catches SDK version mismatches and broken component imports
# before anyone tries to submit to a real cluster.
#
# Got stuck on: the README doesn't say where deploy should push the
# compiled pipeline or trained model, so I left it as a documented stub
# rather than guessing a target. What I'd try next: wire deploy to
# upload pipeline.yaml to a GCS/S3 bucket or submit via run.py once
# the scaffold specifies a deployment target.

name: kubeflow-pipeline-scaffold-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Lint pipeline definition, CLI entrypoint, component code,
      # extracted logic, and tests — one pass catches everything.
      - run: ruff check pipeline.py run.py components/ scripts/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Tests import extracted logic from scripts/ directly, no KFP
      # runtime or MLflow server required — fast and hermetic.
      - run: python -m pytest tests/ -v

  compile:
    name: Compile Pipeline
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Compile the KFP v2 pipeline to pipeline.yaml. This verifies
      # component imports resolve and the DAG structure is valid.
      # If KFP SDK version drift breaks compilation, this job catches it.
      - run: python pipeline.py
      - name: Verify pipeline.yaml was generated
        run: test -f pipeline.yaml
      - name: Upload compiled pipeline
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-yaml
          retention-days: 7
          path: pipeline.yaml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: compile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # The scaffold README documents submission via run.py, but doesn't
      # specify a deployment target cluster. Leaving this as a documented
      # stub rather than guessing a Kubeflow host URL.
      - run: |
          echo "Deploy step — wire this to your Kubeflow cluster"
          echo "e.g. python run.py --host https://your-kubeflow-host"
          echo "Compiled pipeline artifact: pipeline.yaml"
