name: CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check components/ scripts/ tests/ pipeline.py run.py

      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short

      - name: Compile pipeline
        run: python pipeline.py

      - name: Upload compiled pipeline
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pipeline
          path: pipeline.yaml
          retention-days: 7

      - name: Deploy to Kubeflow Pipelines
        if: github.ref == 'refs/heads/main' && env.KUBEFLOW_HOST != ''
        env:
          KUBEFLOW_HOST: ${{ secrets.KUBEFLOW_HOST }}
        run: |
          python run.py --host "$KUBEFLOW_HOST"
