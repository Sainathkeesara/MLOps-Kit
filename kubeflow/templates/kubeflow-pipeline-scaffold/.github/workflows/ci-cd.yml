# last_verified: 2026-07-12 · GitHub Actions CI/CD workflow
# kub-029 — CI/CD workflow for kubeflow-pipeline-scaffold template
# Lints Python, runs pytest, compiles the KFP pipeline, and on a main-branch
# push submits the compiled pipeline to a Kubeflow Pipelines endpoint.
#
# Intentionally pins NO third-party action versions: it relies only on the
# tools already present on the ubuntu-latest runner (git, python3, pip) so the
# file carries no unverified version numbers.

name: CI/CD — Kubeflow Pipeline Scaffold

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Lint, test, and compile pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q "${GITHUB_SHA}"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Lint
        run: |
          python3 -m flake8 components/ scripts/ || true
          python3 -m pylint --fail-under=7 components/ scripts/ || true

      - name: Run pytest
        run: python3 -m pytest tests/ -v

      - name: Compile KFP pipeline
        run: python3 pipeline.py

  deploy:
    name: Submit pipeline to Kubeflow
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: kubeflow

    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q "${GITHUB_SHA}"

      - name: Submit to Kubeflow Pipelines
        env:
          KFP_HOST: ${{ secrets.KFP_HOST }}
        run: |
          python3 run.py --host "$KFP_HOST" --experiment kubeflow-pipeline-scaffold
