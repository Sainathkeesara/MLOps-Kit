# last_verified: 2026-09-04 · metaflow n/a
# mfl-047 — CI/CD workflow for metaflow-project-scaffold (L2)
#
# The scaffold README lists .github/workflows/ci-cd.yml in its project
# structure, but the file is missing on disk. I'm building a workflow
# with lint, test, flow-run, and deploy jobs to match what the README
# promises.
#
# The lint step uses ruff because the kit standardizes on it. The test
# step runs the existing pytest suite. The flow-run job actually executes
# the Metaflow pipeline end-to-end — this is the real value-add over a
# pure lint workflow, since Metaflow flows can fail at runtime due to
# artifact serialization or @pypi resolution.
#
# Got stuck on: the README doesn't say where deploy should push the
# trained model or flow artifacts, so I left it as an echo stub. What
# I'd try next: wire deploy to push the flow's artifacts to S3/GCS
# and register the model in a model registry once the scaffold
# specifies a target.

name: metaflow-project-scaffold-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check flow.py run.py components/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  flow-run:
    name: Flow Run
    runs-on: ubuntu-latest
    needs: test
    # Only run on direct pushes to main — skip on PRs to avoid burning
    # compute cycles on every review.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Run the default flow to verify the pipeline completes end-to-end.
      # Metaflow logs the run ID and status to stdout; we capture it for
      # the deploy step.
      - id: flow-run
        run: |
          python flow.py run 2>&1 | tee flow-output.log
          RUN_ID=$(grep -oE 'Run [a-f0-9]+' flow-output.log | head -1 | awk '{print $2}')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Flow run completed: $RUN_ID"
      - name: Upload flow output
        uses: actions/upload-artifact@v4
        with:
          name: metaflow-run-output
          retention-days: 7
          path: flow-output.log

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: flow-run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # The scaffold README doesn't specify a deployment target, so this
      # is a documented stub rather than a guess.
      - run: |
          echo "Deploy step — wire this to your deployment target"
          echo "(e.g. push artifacts to S3/GCS, register model in registry)"
          echo "Flow run ID: ${{ needs.flow-run.outputs.run_id }}"
