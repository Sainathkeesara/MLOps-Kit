# last_verified: 2026-08-13 · metaflow n/a
# mfl-046 — Fill in .github/workflows/ci-cd.yml for the metaflow-project-scaffold template.
#
# First-contact notes: the scaffold README lists .github/workflows/ci-cd.yml in its
# tree, but the file is missing on disk. I filled it in with the real workflow that
# the template is supposed to ship: lint, test, then deploy.
#
# I kept the lint step small (ruff on components/ and tests/) because that's all the
# scratch scaffold exercises. Tests run against tests/ with pytest from requirements.
# The deploy step drives the same entrypoint a human uses locally (run.py project) so
# CI and local runs behave identically. It only fires on main pushes; a PR should not
# deploy anything.

name: metaflow-project-scaffold-ci-cd

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check components/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run project flow
        run: python run.py project