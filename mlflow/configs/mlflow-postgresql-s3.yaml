# last_verified: 2026-07-05 · mlflow 2.14.0
# MLflow Tracking Server Configuration — PostgreSQL Backend with S3 Artifacts
# Run with: mlflow server --config mlflow-postgresql-s3.yaml

backend_store_uri: postgresql://mlflow:password@postgres-host:5432/mlflow
default_artifact_root: s3://my-mlflow-artifacts-bucket
artifacts_destination: s3://my-mlflow-artifacts-bucket

host: 0.0.0.0
port: 5000

serve_artifacts: true

# S3 configuration
s3_endpoint_url: https://s3.amazonaws.com
s3_upload_artifact_extra_args:
  ServerSideEncryption: AES256