# mlflow_tracking.yaml
# Local MLflow Tracking Server config — SQLite backend + local artifact store.
# Start with: mlflow server --config mlflow_tracking.yaml

backend_store_uri: sqlite:///mlflow.db
default_artifact_root: ./mlruns

# Where the tracking server listens (default: 127.0.0.1:5000)
host: 127.0.0.1
port: 5000

# Serve from this path if behind a reverse proxy
# serve_artifacts: true
# artifacts_destination: ./mlruns

# Disable the built-in model registry (use file-based by default)
# default_model_registry: sqlite:///mlflow.db

# Experiment name for the default experiment
# experiment_name: Default
