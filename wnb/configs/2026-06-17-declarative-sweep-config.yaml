# wnb-013 — Weights & Biases Declarative Sweep Configuration
# L3 config: YAML-based hyperparameter optimization sweep

# Purpose: Define hyperparameter search space as a standalone configuration file
# for team collaboration and version control. Enables non-developers to tune
# parameters without modifying training code.

program: train.py
method: bayes
metric:
  name: val_accuracy
  goal: maximize
parameters:
  learning_rate:
    distribution: log_uniform
    min: 0.0001
    max: 0.1
  batch_size:
    values: [16, 32, 64, 128]
  optimizer:
    values: ["adam", "sgd", "adamw"]
  weight_decay:
    distribution: uniform
    min: 0.0
    max: 0.01
  dropout_rate:
    distribution: uniform
    min: 0.0
    max: 0.5
  hidden_layers:
    values: [1, 2, 3]
  hidden_dim:
    values: [64, 128, 256, 512]
  epochs:
    value: 50
early_terminate:
  type: hyperband
  min_iter: 5
  max_iter: 50
  s: 2