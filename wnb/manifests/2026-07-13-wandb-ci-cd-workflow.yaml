# last_verified: 2026-07-13 · wandb n/a
#
# wnb-034 — W&B project CI/CD workflow (GitHub Actions)
#
# The wandb-cicd-project template's README promises a CI workflow
# but the file was missing from the template scaffold. This manifest
# fills that gap: it runs training, logs metrics/artifacts to W&B,
# and promotes the best model via the W&B Model Registry.
#
# Prerequisites:
#   - GitHub repository secrets: WANDB_API_KEY, WANDB_ENTITY
#   - W&B project created in the target entity
#
# How to use in your template:
#   - Copy to .github/workflows/ci-cd.yml in your template repo
#   - Update WANDB_PROJECT to match your project name
#   - 'on.push.paths' is optional — adjust to your source layout

name: wandb-ci-cd

on:
  push:
    branches: [main]
    # paths: ["src/**", "configs/**", "requirements.txt"]
  pull_request:
    branches: [main]

jobs:
  train-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run training job
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
          WANDB_PROJECT: wandb-cicd-demo
        run: python train.py

      - name: Register best model in W&B Model Registry
        if: github.ref == 'refs/heads/main'
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
          WANDB_PROJECT: wandb-cicd-demo
        run: |
          python -c "
import wandb, json, os
api = wandb.Api()
entity = os.environ['WANDB_ENTITY']
project = os.environ['WANDB_PROJECT']
runs = api.runs(f'{entity}/{project}')
best = min(runs, key=lambda r: r.summary.get('val_loss', float('inf')))
run_id = best.id
try:
    artifact = api.artifact(f'{entity}/{project}/model-{run_id}:latest')
    artifact.link(f'{entity}/model-registry/WandbCICDModel', latest=True)
    print(f'Linked run {run_id} model to Model Registry')
except Exception as e:
    print(f'Linking skipped (no artifact or registry configured): {e}')
"
