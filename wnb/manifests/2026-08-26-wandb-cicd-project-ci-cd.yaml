# last_verified: 2026-08-26 · wandb n/a
#
# wnb-051 — CI/CD workflow for the wandb-cicd-project template (L2)
#
# I wrote this as a reference manifest that the template can copy into
# its own .github/workflows/ci-cd.yml. The scaffold only has train.py
# and evaluate.py, so I lint both files, run a quick training sanity
# check, and promote the produced model artifact into the W&B Model
# Registry on pushes to main.

name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --quiet ruff
      - run: ruff check train.py evaluate.py sweep.py

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - run: |
          python -c "import train; import evaluate; print('imports OK')"
          python train.py --n-estimators 10 --max-depth 3
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
          WANDB_PROJECT: wandb-cicd-demo
          WANDB_MODE: offline

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: Promote best model to W&B Model Registry
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
          WANDB_PROJECT: wandb-cicd-demo
        run: |
          python -c "
          import wandb, os
          api = wandb.Api()
          entity = os.environ['WANDB_ENTITY']
          project = os.environ['WANDB_PROJECT']
          runs = api.runs(f'{entity}/{project}')
          best = max(runs, key=lambda r: r.summary.get('accuracy', 0))
          run_id = best.id
          try:
              artifact = api.artifact(f'{entity}/{project}/rf-model-run-{run_id[:8]}:latest')
              artifact.link(f'{entity}/model-registry/WandbCICDModel', latest=True)
              print(f'Linked run {run_id} model to Model Registry')
          except Exception as e:
              print(f'Linking skipped (no artifact or registry configured): {e}')
          "
