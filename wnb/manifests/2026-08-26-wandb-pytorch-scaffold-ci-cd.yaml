# last_verified: 2026-08-26 · wnb n/a
# wnb-052 — CI/CD workflow for wandb-pytorch-scaffold (L2)
#
# The scaffold README lists .github/workflows/ci-cd.yml in its project
# structure, but the file is missing on disk. I built a minimal workflow
# with lint, test, and deploy jobs to match what the README promises.
#
# The lint step uses ruff because the kit already standardizes on it.
# The test step only verifies imports — the scaffold doesn't ship a test
# suite, so I didn't invent one. The deploy step is a stub; I'm not
# assuming a specific registry or deployment target.
#
# What I'd try next: add a sweep job once I decide whether CI should
# run hyperparameter sweeps or only on tagged releases.

name: wandb-pytorch-scaffold-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check train.py sweep.py components/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -c "import train; import sweep; print('imports OK')"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy step — wire this to your model registry or deployment target."
