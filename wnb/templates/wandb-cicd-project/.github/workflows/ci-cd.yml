name: Train and Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up W&B
        uses: wandb/action@v1
        with:
          wandb-key: ${{ secrets.WANDB_API_KEY }}

      - name: Run training
        run: |
          python train.py --n-estimators 100 --max-depth 5

      - name: Run sweep (PR only)
        if: github.event_name == 'pull_request'
        run: |
          wandb sweep configs/sweep-config.yaml

  evaluate:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up W&B
        uses: wandb/action@v1
        with:
          wandb-key: ${{ secrets.WANDB_API_KEY }}

      - name: Evaluate best model (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Model evaluation on main branch"