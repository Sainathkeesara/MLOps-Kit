# last_verified: 2026-08-09 · wnb n/a
# wnb-046 — CI/CD workflow for wandb-cicd-project (L2)
#
# The README promises a CI workflow but the file was missing from the
# template scaffold. Filling that gap: lint, test, sweep (hyperparameter
# optimization), and deploy (model promotion via W&B Model Registry).
#
# Prerequisites:
#   - GitHub secret WANDB_API_KEY for W&B API authentication
#   - GitHub secret WANDB_ENTITY for the target W&B entity
#
# Notes:
#   - Sweep only runs on main to avoid burning compute on every PR
#   - Deploy is a placeholder — wire it to your model registry or serving
#     platform (e.g. promote best sweep run to the W&B Model Registry)

name: wandb-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      # smoke test: verify all modules import without errors
      - run: python -c "import train; import evaluate; import sweep; print('imports OK')"

  sweep:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: |
          sweep_id=$(wandb sweep configs/sweep-config.yaml | tail -n 1 | awk '{print $NF}')
          wandb agent "$sweep_id"
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
          WANDB_PROJECT: wandb-cicd-demo

  deploy:
    runs-on: ubuntu-latest
    needs: sweep
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy step — promote best sweep run model to your model registry here."
