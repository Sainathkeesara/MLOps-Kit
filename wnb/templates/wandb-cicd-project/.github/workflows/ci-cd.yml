# last_verified: 2026-07-11 · Weights & Biases CI/CD workflow template

# GitHub Actions CI/CD pipeline for the wandb-cicd-project scaffold.
# Mirrors the steps described in this template's README: install deps,
# train with default params, log metrics + model artifact to W&B, then
# run a sweep and pick the best run. Auth uses the WANDB_API_KEY secret.
name: CI/CD — W&B Training Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  train:
    name: Train and log to W&B
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train (default params) and upload model artifact
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: wandb-cicd-demo
        run: python train.py --n-estimators 100 --max-depth 5

  sweep:
    name: Hyperparameter sweep and evaluate
    runs-on: ubuntu-latest
    # Sweeps mutate shared state, so only run them on main pushes, not PRs.
    if: github.ref == 'refs/heads/main'
    needs: train
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Launch sweep
        id: sweep
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: wandb-cicd-demo
        run: |
          SWEEP_ID=$(wandb sweep --project wandb-cicd-demo configs/sweep-config.yaml | grep -oE 'wandb-cicd-demo/[a-z0-9]{8}' | head -n1 | cut -d/ -f2)
          echo "sweep_id=$SWEEP_ID" >> "$GITHUB_OUTPUT"
          wandb agent "wandb-cicd-demo/$SWEEP_ID"

      - name: Evaluate best run
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python evaluate.py \
            --sweep-id "${{ steps.sweep.outputs.sweep_id }}" \
            --entity "${{ github.repository_owner }}" \
            --project wandb-cicd-demo \
            --threshold 0.9
