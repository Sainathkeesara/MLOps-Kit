# last_verified: 2026-08-08 · wnb n/a
name: W&B PyTorch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: pytest

  sweep:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: |
          sweep_id=$(wandb sweep configs/sweep-config.yaml | tail -n 1 | awk '{print $NF}')
          wandb agent "$sweep_id"
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: [sweep]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy step placeholder — integrate with your model registry or serving platform here."
