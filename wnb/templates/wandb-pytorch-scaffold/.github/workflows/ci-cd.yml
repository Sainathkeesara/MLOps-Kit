# last_verified: 2026-08-14 · wnb n/a
# wnb-050 — CI/CD workflow for wandb-pytorch-scaffold (L1)
#
# First-contact notes: the scaffold README lists .github/workflows/ci-cd.yml
# in its tree, but the file was missing on disk. I filled it in with the
# real workflow the template promises: lint, test, sweep, and deploy.
#
# The scaffold ships train.py, sweep.py, configs/sweep-config.yaml, and
# requirements.txt, so the steps below resolve against those paths.

name: wandb-pytorch-scaffold-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check train.py sweep.py components/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -c "import train; import sweep; print('imports OK')"

  sweep:
    name: Sweep
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          sweep_id=$(wandb sweep configs/sweep-config.yaml | tail -n 1 | awk '{print $NF}')
          wandb agent "$sweep_id"
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
          WANDB_PROJECT: wandb-pytorch-scaffold

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: sweep
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy step — promote best sweep run to your model registry here."
