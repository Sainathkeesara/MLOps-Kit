program: sweep.py
method: bayes
metric:
  name: val_accuracy
  goal: maximize
parameters:
  lr:
    min: 0.0001
    max: 0.01
  hidden_dim:
    values: [32, 64, 128]
  batch_size:
    values: [16, 32, 64]
  epochs:
    values: [5, 10, 20]
early_terminate:
  type: hyperband
  min_iter: 3
count: 10